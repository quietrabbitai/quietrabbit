[package]
name = "quietrabbit"
version = "0.1.0"
edition = "2021"

[lib]
name = "quietrabbit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
pkg-config = "0.3"
# Reads tauri.conf.json's productName in build.rs, to compute the same
# usr/lib/<productName>/ path Tauri's bundler and resource_dir() use --
# see build.rs's ggml runtime rpath comment.
serde_json = "1"

[dependencies]
# Framework & Runtime
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["full"] }

# Serialization & Parsing
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "sqlite"] }
# Enable the sqlcipher feature on libsqlite3-sys so the unified dependency
# links against SQLCipher rather than standard SQLite. Feature unification
# requires a single resolved libsqlite3-sys instance — verified: v0.30.1 only.
libsqlite3-sys = { version = "0.30.1", features = ["sqlcipher"] }
indexmap = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

chrono = { version = "0.4", features = ["serde"] }
gethostname = "0.4"
log = "0.4"
zeroize = { version = "1.8", features = ["derive"] }

# Argon2id master-key derivation (items.id=205, Architecture Section 4.1).
# default-features disabled deliberately: no PHC-string/PasswordVerifier
# password-hash convenience API is used directly by this codebase (QR never
# stores or interoperates with PHC-formatted hashes -- confirmed against
# Architecture/AUTH_MULTIUSER_ARCHITECTURE.md this session, no PHC/
# password_hash reference exists in that document; salts are generated/
# stored via getrandom + user_salts.salt_hex directly).
#
# "alloc" IS required, corrected this session: hash_password_into() -- the
# function this codebase actually calls, which derives a fixed-length key
# into a caller-owned buffer -- is itself gated "Available on crate features
# alloc and password-hash only" (argon2 0.5.3 docs, verified this session).
# alloc's own feature definition enables password-hash/alloc as a
# consequence (verified via the crates.io sparse index), so password-hash
# compiles in as a side effect of alloc regardless -- confirmed empirically
# this session (cargo test failed to find hash_password_into without alloc,
# and the crate's own docs name hash_password_into_with_memory, which
# requires the caller to manage an explicit argon2::Block buffer, as the
# only no-alloc alternative). Not switching to that lower-level API: the
# password-hash crate that comes along with alloc is unused, inert code
# (its PasswordHash/SaltString types are never referenced anywhere in this
# codebase), not an active surface -- the meaningful dependency-minimization
# win (no PHC-string handling, no external password-hash interop) already
# holds regardless of which of these two argon2 APIs is used.
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
# Explicit direct dependency rather than relying on it being transitively
# available via uuid's v4 feature (fragile if that feature set ever
# changes) -- version pinned to match the already-resolved transitive
# version (0.4.x, verified via cargo tree this session) to avoid a
# duplicate-major-version dependency tree.
getrandom = "0.4"

# Networking & Errors
reqwest = { version = "0.12", features = ["json"] }
thiserror = "1"
async-trait = "0.1"

# FFI
libc = "0.2"

# IPC Type Contract
tauri-specta = { version = "2.0.0-rc.25", features = ["derive", "typescript"] }
specta = { version = "2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"

# Tier 2/Tier 3 external session embedding (items.id=3 States 4-5,
# decisions.id=699 -- Option 3b, CEF off-screen rendering). Version pinned to
# the current published crates.io release, one patch ahead of 151.0.0+151.3.11
# (the exact version the full items.id=192/195/196/198/199/200/201 evidence
# chain tested) -- verified current/active via the crates.io sparse index
# (index.crates.io/3/c/cef) this session, 2026-08-01. Behavior will be
# validated against the spike's proven results during Phase A build/test,
# not assumed identical on version alone.
cef = { version = "151.1.0", features = ["accelerated_osr"] }
# OSR render pipeline + single-window GTK/wgpu compositing (items.id=202
# piece 5 real fix, 2026-08-07 -- replaces the separate-winit-window-per-pane
# architecture, which depended on tauri::Window::inner_position()/inner_size(),
# confirmed broken on Wayland -- tauri-apps/tauri#12411, tauri-apps/tao#566).
# wgpu now presents into a gtk::GLArea overlaid on Tauri's own webview in its
# own window, via wgpu-hal's external-GL-context interop
# (wgpu_hal::gles::Adapter::new_external) -- proven working this session
# (matched glReadPixels across 19 frames, direct visual confirmation of a
# wgpu-rendered pane composited over a real webview). winit is dropped
# entirely: CEF's panes were always off-screen-rendered (no OS window of
# their own), the per-pane winit::Window only ever existed to give wgpu a
# presentation surface and something to position-sync -- gone now that wgpu
# presents into GTK's own framebuffer instead.
wgpu = "30"
# Direct dependency on the exact version already resolved transitively via
# wgpu (see Cargo.lock) -- needed directly for the external-adapter/
# hal-interop API surface (wgpu_hal::gles::Adapter::new_external,
# wgpu_hal::gles::Texture::default_framebuffer, wgpu_hal::api::Gles), which
# is not re-exported through the public wgpu crate.
wgpu-hal = { version = "30", features = ["gles"] }
wgpu-types = "30"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
env_logger = "0.11"
glib = "0.18"
# GTK widget-tree access (overlay compositing the GLArea onto Tauri's own
# webview widget, obtained via tauri::WebviewWindow::gtk_window()/
# default_vbox()) -- version pinned to match gtk-rs's own already-resolved
# transitive version (see Cargo.lock), the same version tauri/wry build
# against on Linux.
gtk = "0.18"
# webkit2gtk-rs's WebViewExt (run_javascript) -- version pinned to match the
# same already-resolved transitive version wry/tauri-runtime-wry build
# against (see Cargo.lock), same rationale as the gtk pin above. Needed for
# items.id=227's reimplemented mouse-back/forward JS synthesis in
# pane_host.rs (see that module's own doc comment for why this is
# reimplemented locally rather than reused from wry).
webkit2gtk = "2.0.2"
# GL function loading. Originally planned as the `epoxy` crate (the standard
# gtk-rs pattern, since GTK itself loads GL via libepoxy on Linux) -- dropped
# after `cargo build` found it unbuildable via crates.io: its `gl_generator`
# build-dependency requires `xml-rs = "^0.7.0"`, every published 0.7.x version
# of which is yanked, so dependency resolution fails outright regardless of
# this crate's own version pin. `libloading` dlopen's libepoxy directly for
# `epoxy_get_proc_address` instead (a single stable C symbol, no codegen
# needed) -- both the GL proc-address loader
# `wgpu_hal::gles::Adapter::new_external` requires, and (via `glow`, already
# resolved transitively through wgpu-hal's `gles` backend, added here
# directly for its own safe API) the raw GL_DRAW_FRAMEBUFFER_BINDING
# capture/rebind calls single-window compositing needs outside wgpu's own
# abstraction (wgpu-hal does not preserve the host's framebuffer binding,
# confirmed this session).
libloading = "0.8"
glow = "0.16"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
unicode-normalization = "0.1"
tempfile = "3"
# tauri::test::mock_app()/mock_builder() for testing #[tauri::command]
# functions that take tauri::State<T> (items.id=205, commands/auth.rs
# login/logout tests) without needing the full webview/IPC layer -- "test"
# is a real feature on this exact pinned version (tauri 2.11.x, verified
# via docs.rs source Cargo.toml this session). dev-dependencies only, not
# [dependencies] -- this feature and its mock app machinery must never
# compile into a production build.
tauri = { version = "2", features = ["test"] }
